<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      <img src="{{ '/images/chaii.png' | relative_url }}" alt="" width="56" height="56">
      <span><strong>{{ site.short_title }}</strong><small>Causal AI and Healthcare</small></span>
    </a>
    <nav aria-label="Main navigation">
      <ul>
        {% for item in site.data.navigation %}
          <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
