- name: "Dr Vinod Kumar Chauhan"
  category: "Principal Investigator"
  photo: "/images/211.jpg"
  photo_alt: "Dr Vinod Kumar Chauhan"
  video: "https://www.youtube-nocookie.com/embed/fclyyIpTwOU?si=Gb6UstDpZTRQIzZ8"
  video_title: "Dr Vinod Kumar Chauhan discusses his journey as an MPLS Enterprise and Innovation Fellow"
  show_talks: true
  career:
    - dates: "Aug 2025–present"
      role: "Chancellor's Fellow in AI (Lecturer/Assistant Professor)"
      institution: "University of Strathclyde, Glasgow, UK"
    - dates: "Feb 2022–Jul 2025"
      role: "Postdoctoral Researcher in AI for Healthcare"
      institution: "University of Oxford, Oxford, UK"
    - dates: "May 2019–Jan 2022"
      role: "Postdoctoral Researcher in Industrial Machine Learning"
      institution: "University of Cambridge, Cambridge, UK"
    - dates: "Sep 2015–Jan 2019"
      role: "PhD"
      institution: "Panjab University, Chandigarh, India"
  biography: >-
    I am a Strathclyde Chancellor's Fellow in AI in the Department of Computer and Information Sciences at the University of Strathclyde. My research spans causal and agentic AI, machine learning and personalised decision-making, with healthcare as a principal application domain.
  biography_additional:
    - >-
      During my postdoctoral work, I collaborated with clinicians and industry partners on real-world healthcare and industrial challenges. At Cambridge, this included collaborations with Boeing and Rolls-Royce, and my work received the Institute for Manufacturing Postdoctoral Award for Research Excellence.
    - >-
      I completed my PhD in optimisation for large-scale machine learning at Panjab University, Chandigarh, supported by the University Grants Commission’s Junior and Senior Research Fellowships. I was born and brought up in a small village in Hamirpur, Himachal Pradesh, India.
    - >-
      I actively contribute to the research community and have reviewed more than 200 articles for over 50 international journals and conferences. I am a Senior Member of IEEE, a professional member of ACM, and a lifetime member of the Computer Society of India and the Indian Society for Technical Education.
    - >-
      I welcome enquiries from motivated MSc (Research) and PhD students, as well as collaborations with academic, clinical and industry partners.
  editorial_roles:
    - role: "Associate Editor"
      outlets: "PLOS Digital Health · BMC BioData Mining"
    - role: "Editorial Board Member"
      outlets: "International Journal of Artificial Intelligence in Healthcare"
    - role: "Guest Editor"
      outlets: "Frontiers in AI"
  awards:
    - text: "MPLS Enterprise & Innovation Fellowship (£1,000), University of Oxford, 2025–26."
      url: "https://www.mpls.ox.ac.uk/training/enterprise/enterprise-and-innovation-fellowships/meet-the-mpls-enterprise-and-innovation-fellows/mpls-enterprise-and-innovation-fellows-2025-26"
    - text: "Institute for Manufacturing Postdoctoral Award for Research Excellence (£250), University of Cambridge, 2021."
      url: "https://www.ifm.eng.cam.ac.uk/news/ifm-postdoctoral-awards-2021/"
    - text: "Student Travel Grant Award ($300), Asian Conference on Machine Learning (ACML), South Korea, 2017."
      url: "https://www.acml-conf.org/2017/"
    - text: "University Grants Commission Junior and Senior Research Fellowships for PhD study, awarded through the highly competitive national UGC-NET examination."
    - text: "Sixth university rank in BSc studies and a merit fellowship for master's study."
    - text: "Matric merit fellowship and Sanskrit merit fellowship in eighth standard."
    - text: "UK Global Talent Visa endorsement through peer review, 2023."
    - text: "Lucy Cavendish College, University of Cambridge, Junior Research Fellowship, awarded through a postdoctoral competition (non-stipendiary)."
      url: "https://www.lucy.cam.ac.uk/blog/lucy-connections-learn-share-enhance-social-intellectual-experience"
