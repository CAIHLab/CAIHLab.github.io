<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include header.html %}
    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/external-links.js' | relative_url }}" defer></script>
    {% if page.publication_filters %}
      <script src="{{ '/assets/js/publications.js' | relative_url }}" defer></script>
    {% endif %}
    {% if page.news_filters %}
      <script src="{{ '/assets/js/news.js' | relative_url }}" defer></script>
    {% endif %}
    {% if page.altmetric_badges %}
      <script src="https://embed.altmetric.com/assets/embed.js" defer></script>
    {% endif %}
    <!-- Cloudflare Web Analytics -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"29cc038529df485e8523e209fe24b5e8"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
