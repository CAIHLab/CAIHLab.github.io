---
layout: default
---
{% if page.hero %}
  {{ content }}
{% else %}
  <article class="page-shell">
    <header class="page-heading">
      <p class="eyebrow">{{ page.eyebrow | default: site.short_title }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.intro %}<p class="lead">{{ page.intro }}</p>{% endif %}
    </header>
    <div class="prose">
      {{ content }}
    </div>
  </article>
{% endif %}
