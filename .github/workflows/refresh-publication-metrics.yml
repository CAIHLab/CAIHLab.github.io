name: Refresh publication metrics

on:
  push:
    branches: [main]
    paths:
      - "_data/publications.yml"
      - "scripts/refresh_publication_metrics.rb"
      - ".github/workflows/refresh-publication-metrics.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Refresh cached citation counts
        env:
          OPENALEX_MAILTO: vinod.chauhan@strath.ac.uk
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: ruby scripts/refresh_publication_metrics.rb
      - name: Commit changed metrics
        run: |
          if git diff --quiet -- _data/publication_metrics.json; then
            echo "Publication metrics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publication_metrics.json
          git commit -m "chore: refresh publication metrics"
          git push
