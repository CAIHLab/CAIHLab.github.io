title: "Causal AI and Healthcare Lab"
short_title: "CAIH Lab"
description: "Making data-driven personalised healthcare a reality through causal AI."
url: "https://caihlab.github.io"
baseurl: ""
repository: "CAIHLab/CAIHLab.github.io"
lang: "en-GB"
timezone: "Europe/London"

markdown: kramdown
permalink: pretty
theme: null

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

# Optional. Set this to a Google Analytics measurement ID (for example G-XXXX)
# to enable analytics. Leave it blank to load no analytics scripts.
google_analytics_id: ""

social_image: "/images/chaii.png"

exclude:
  - .bundle
  - .github
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: page
